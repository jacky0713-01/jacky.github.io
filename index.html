<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox throw a coin index progress</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --header-bg: #0f172a;
      --table-header-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success-bg: rgba(16, 185, 129, 0.15);
      --success-text: #34d399;
      --success-border: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .title-group h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(to right, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .auth-status {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    .btn:hover { background-color: var(--accent-hover); }
    .btn-danger { background-color: #ef4444; }
    .btn-danger:hover { background-color: #dc2626; }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
    }

    .stat-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .search-input {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      flex: 1;
      min-width: 200px;
    }
    .search-input:focus { border-color: var(--accent); }

    .table-container {
      overflow-x: auto;
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      max-height: 75vh;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      background-color: #1e293b;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
      color: var(--text-main);
      vertical-align: middle;
    }

    tr:hover td {
      background-color: rgba(255, 255, 255, 0.03);
    }

    /* 圖片樣式與懸停放大效果 */
    .item-img-container {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px dashed var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .item-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.2s;
    }

    .item-img-container:hover .item-img {
      transform: scale(1.6);
      z-index: 20;
    }

    .img-placeholder {
      font-size: 0.75rem;
      color: #475569;
      text-align: center;
    }

    /* 可編輯提示樣式 */
    body:not(.read-only) .editable-cell:hover {
      background-color: rgba(99, 102, 241, 0.15);
      cursor: pointer;
    }

    /* 稀有度顏色豐富設置 */
    .rarity-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      text-transform: capitalize;
    }

    /* 各種稀有度專屬顏色 */
    .rarity-common { color: #9e9e9e; background: rgba(158, 158, 158, 0.15); border: 1px solid #616161; }
    .rarity-uncommon { color: #4caf50; background: rgba(76, 175, 80, 0.15); border: 1px solid #388e3c; }
    .rarity-rare { color: #2196f3; background: rgba(33, 150, 243, 0.15); border: 1px solid #1976d2; }
    .rarity-epic { color: #ab47bc; background: rgba(171, 71, 188, 0.15); border: 1px solid #7b1fa2; }
    .rarity-legendary { color: #ffa726; background: rgba(255, 167, 38, 0.15); border: 1px solid #f57c00; }
    .rarity-mythic { color: #ef5350; background: rgba(239, 83, 80, 0.15); border: 1px solid #d32f2f; }
    .rarity-cosmic { color: #26c6da; background: rgba(38, 198, 218, 0.15); border: 1px solid #0097a7; }
    .rarity-celestial { color: #ec407a; background: rgba(236, 64, 122, 0.15); border: 1px solid #c2185b; }
    
    .rarity-chronal { color: #00bcd4; background: rgba(0, 188, 212, 0.15); border: 1px solid #0097a7; }
    .rarity-carved { color: #8d6e63; background: rgba(141, 110, 99, 0.15); border: 1px solid #5d4037; }
    .rarity-honed { color: #78909c; background: rgba(120, 144, 156, 0.15); border: 1px solid #455a64; }
    .rarity-tempered { color: #26a69a; background: rgba(38, 166, 154, 0.15); border: 1px solid #00796b; }
    .rarity-yokai { color: #3b82f6; background: rgba(59, 130, 246, 0.15); border: 1px solid #1d4ed8; }
    .rarity-veiled { color: #a855f7; background: rgba(168, 85, 247, 0.15); border: 1px solid #6b21a8; }
    .rarity-hallowed { color: #ec4899; background: rgba(236, 72, 153, 0.15); border: 1px solid #be185d; }
    .rarity-imperial { color: #f59e0b; background: rgba(245, 158, 11, 0.2); border: 1px solid #d97706; box-shadow: 0 0 8px rgba(245, 158, 11, 0.3); }

    .status-cell {
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .badge-empty { color: #475569; }

    .badge-collected {
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    .count-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .count-btn {
      background: #334155;
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      display: none;
      font-weight: bold;
      line-height: 1;
    }

    body:not(.read-only) .count-box:hover .count-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    body.read-only .status-cell,
    body.read-only .count-box,
    body.read-only .editable-cell {
      pointer-events: none;
    }
  </style>
</head>
<body class="read-only">

  <header>
    <div class="title-group">
      <h1>Roblox throw a coin index progress</h1>
    </div>
    <div class="auth-box">
      <span id="auth-status" class="auth-status">當前狀態：瀏覽模式 (唯讀)</span>
      <button id="auth-btn" class="btn">管理員登入</button>
    </div>
  </header>

  <div class="dashboard">
    <div class="stat-card">
      <div class="stat-title">Astral 收集進度</div>
      <div id="stat-astral" class="stat-value">0 / 188 (0%)</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Divine 收集進度</div>
      <div id="stat-divine" class="stat-value">0 / 188 (0%)</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Void 收集進度</div>
      <div id="stat-void" class="stat-value">0 / 188 (0%)</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Astral 總數量</div>
      <div id="stat-count-total" class="stat-value">0</div>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="search-input" class="search-input" placeholder="搜尋物品名稱或編號 (登入後雙擊名稱/圖片/稀有度可編輯)...">
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 70px;">編號</th>
          <th style="width: 200px;">物品名稱</th>
          <th style="width: 80px; text-align: center;">圖片</th>
          <th style="width: 130px;">稀有度</th>
          <th style="width: 120px; text-align: center;">Astral</th>
          <th style="width: 130px; text-align: center;">Astral Count</th>
          <th style="width: 120px; text-align: center;">Divine</th>
          <th style="width: 120px; text-align: center;">Void</th>
        </tr>
      </thead>
      <tbody id="table-body">
      </tbody>
    </table>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBh4wNEwXzGOxKOJqj3Akg7gj1WxFHzmNQ",
      authDomain: "throw-a-coin.firebaseapp.com",
      projectId: "throw-a-coin",
      storageBucket: "throw-a-coin.firebasestorage.app",
      messagingSenderId: "79225369395",
      appId: "1:79225369395:web:ac6b6dadb1154159c40446",
      measurementId: "G-B84NLZX6Z8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const defaultDatabase = {
      163: { name: "Nautilus", rarity: "Chronal" },
      164: { name: "Training Dummy", rarity: "Carved" },
      165: { name: "Golden Fan", rarity: "Carved" },
      166: { name: "Bonsai Tree", rarity: "Carved" },
      167: { name: "Lucky Medallion", rarity: "Carved" },
      168: { name: "War Drum", rarity: "Honed" },
      169: { name: "Shuriken", rarity: "Honed" },
      170: { name: "Stone Lantern", rarity: "Honed" },
      171: { name: "Katana", rarity: "Tempered" },
      172: { name: "Emperor Crown", rarity: "Tempered" },
      173: { name: "Sacred Vase", rarity: "Tempered" },
      174: { name: "Oni Mask", rarity: "Yokai" },
      175: { name: "Oni Hammer", rarity: "Yokai" },
      176: { name: "Torii Gate", rarity: "Veiled" },
      177: { name: "Imperial Throne", rarity: "Veiled" },
      178: { name: "Dojo", rarity: "Hallowed" },
      179: { name: "Great Pagoda", rarity: "Hallowed" },
      180: { name: "Dragon Temple", rarity: "Imperial" },
      181: { name: "Imperial Seal", rarity: "Imperial" }
    };

    const TOTAL_ITEMS = 188;
    let itemsData = {};

    for (let i = 1; i <= TOTAL_ITEMS; i++) {
      const preset = defaultDatabase[i] || {};
      itemsData[`item_${i}`] = {
        id: i,
        name: preset.name || `物品 #${i}`,
        rarity: preset.rarity || `Common`,
        imageUrl: "",
        astral: false,
        astralCount: 0,
        divine: false,
        void: false
      };
    }

    const tbody = document.getElementById("table-body");
    const authBtn = document.getElementById("auth-btn");
    const authStatus = document.getElementById("auth-status");
    const searchInput = document.getElementById("search-input");

    function render() {
      const query = searchInput.value.toLowerCase().trim();
      tbody.innerHTML = "";

      let astralCountSum = 0;
      let astralCollected = 0;
      let divineCollected = 0;
      let voidCollected = 0;

      const sortedKeys = Object.keys(itemsData).sort((a, b) => itemsData[a].id - itemsData[b].id);

      sortedKeys.forEach(key => {
        const item = itemsData[key];

        if (item.astral) astralCollected++;
        if (item.divine) divineCollected++;
        if (item.void) voidCollected++;
        astralCountSum += (item.astralCount || 0);

        const matchSearch = item.name.toLowerCase().includes(query) || String(item.id).includes(query);
        if (!matchSearch) return;

        // 計算稀有度 class 名稱 (轉小寫處理)
        const rarityClass = item.rarity ? `rarity-${item.rarity.toLowerCase()}` : 'rarity-common';

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>#${item.id}</strong></td>
          <td class="editable-cell" ondblclick="editField('${key}', 'name')" title="登入後雙擊修改名稱"><strong>${item.name}</strong></td>
          <td class="editable-cell" style="text-align: center;" ondblclick="editField('${key}', 'imageUrl')" title="登入後雙擊設定圖片網址">
            <div class="item-img-container" style="margin: 0 auto;">
              ${item.imageUrl ? `<img src="${item.imageUrl}" class="item-img" alt="${item.name}">` : `<span class="img-placeholder">+圖片</span>`}
            </div>
          </td>
          <td class="editable-cell" ondblclick="editField('${key}', 'rarity')" title="登入後雙擊修改稀有度">
            <span class="rarity-tag ${rarityClass}">${item.rarity}</span>
          </td>
          <td class="status-cell" onclick="toggleStatus('${key}', 'astral')">
            <span class="badge ${item.astral ? 'badge-collected' : 'badge-empty'}">${item.astral ? '✓ 已收集' : '-'}</span>
          </td>
          <td class="status-cell">
            <div class="count-box">
              <button class="count-btn" onclick="adjustCount(event, '${key}', -1)">-</button>
              <span onclick="editCountDirect('${key}')" style="min-width: 24px; text-align: center; font-weight: 700;">${item.astralCount || 0}</span>
              <button class="count-btn" onclick="adjustCount(event, '${key}', 1)">+</button>
            </div>
          </td>
          <td class="status-cell" onclick="toggleStatus('${key}', 'divine')">
            <span class="badge ${item.divine ? 'badge-collected' : 'badge-empty'}">${item.divine ? '✓ 已收集' : '-'}</span>
          </td>
          <td class="status-cell" onclick="toggleStatus('${key}', 'void')">
            <span class="badge ${item.void ? 'badge-collected' : 'badge-empty'}">${item.void ? '✓ 已收集' : '-'}</span>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("stat-astral").innerText = `${astralCollected} / ${TOTAL_ITEMS} (${((astralCollected/TOTAL_ITEMS)*100).toFixed(1)}%)`;
      document.getElementById("stat-divine").innerText = `${divineCollected} / ${TOTAL_ITEMS} (${((divineCollected/TOTAL_ITEMS)*100).toFixed(1)}%)`;
      document.getElementById("stat-void").innerText = `${voidCollected} / ${TOTAL_ITEMS} (${((voidCollected/TOTAL_ITEMS)*100).toFixed(1)}%)`;
      document.getElementById("stat-count-total").innerText = astralCountSum;
    }

    // 雙擊修改名稱 / 圖片網址 / 稀有度
    window.editField = async (key, field) => {
      if (!auth.currentUser) return;
      let labelMap = { name: '物品名稱', imageUrl: '圖片網址 (URL)', rarity: '稀有度' };
      const currentVal = itemsData[key][field] || '';
      const newVal = prompt(`請輸入新的 ${labelMap[field]}（編號 #${itemsData[key].id}）：`, currentVal);
      if (newVal !== null) {
        itemsData[key][field] = newVal.trim();
        render();
        await syncToCloud();
      }
    };

    window.toggleStatus = async (key, type) => {
      if (!auth.currentUser) return;
      itemsData[key][type] = !itemsData[key][type];
      render();
      await syncToCloud();
    };

    window.adjustCount = async (e, key, delta) => {
      e.stopPropagation();
      if (!auth.currentUser) return;
      const current = itemsData[key].astralCount || 0;
      itemsData[key].astralCount = Math.max(0, current + delta);
      render();
      await syncToCloud();
    };

    window.editCountDirect = async (key) => {
      if (!auth.currentUser) return;
      const current = itemsData[key].astralCount || 0;
      const input = prompt(`請輸入 ${itemsData[key].name} 的 Astral 數量：`, current);
      if (input !== null && !isNaN(input)) {
        itemsData[key].astralCount = Math.max(0, parseInt(input, 10));
        render();
        await syncToCloud();
      }
    };

    async function syncToCloud() {
      try {
        await setDoc(doc(db, "tracker", "progress"), { items: itemsData }, { merge: true });
      } catch (e) {
        console.error("同步失敗：", e);
      }
    }

    onSnapshot(doc(db, "tracker", "progress"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.items) {
          Object.keys(data.items).forEach(key => {
            if (itemsData[key]) {
              itemsData[key] = { ...itemsData[key], ...data.items[key] };
            }
          });
          render();
        }
      }
    });

    searchInput.addEventListener("input", render);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.body.classList.remove("read-only");
        authStatus.innerText = `管理者已登入 (${user.email})`;
        authBtn.innerText = "登出";
        authBtn.classList.add("btn-danger");
      } else {
        document.body.classList.add("read-only");
        authStatus.innerText = "當前狀態：瀏覽模式 (唯讀)";
        authBtn.innerText = "管理員登入";
        authBtn.classList.remove("btn-danger");
      }
    });

    authBtn.onclick = async () => {
      if (auth.currentUser) {
        await signOut(auth);
      } else {
        const email = prompt("請輸入管理者 Email：");
        const password = prompt("請輸入密碼：");
        if (email && password) {
          try {
            await signInWithEmailAndPassword(auth, email, password);
          } catch (err) {
            alert("登入失敗：帳號或密碼錯誤！");
          }
        }
      }
    };

    render();
  </script>
</body>
</html>
