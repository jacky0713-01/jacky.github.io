            document.getElementById("stat-completed").textContent = completedCount;
            document.getElementById("stat-incomplete").textContent = total - completedCount;
            
            document.getElementById("global-progress-text").textContent = `${progressPct}%`;
            document.getElementById("global-progress-bar").style.width = `${progressPct}%`;
        }

        function getStatusBadge(isCollected) {
            if (isCollected) {
                return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-950/80 text-emerald-400 border border-emerald-800/60 glow-green">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>已收集
                </span>`;
            } else {
                return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-950/50 text-rose-400 border border-rose-900/40 opacity-75">
                    未收集
                </span>`;
            }
        }

        function renderTable() {
            const tbody = document.getElementById("items-table-body");
            const emptyState = document.getElementById("empty-state");
            tbody.innerHTML = "";

            const filtered = RAW_DATA.filter(item => {
                const matchSearch = item.name.toLowerCase().includes(currentSearch) || 
                                    item.category.toLowerCase().includes(currentSearch) ||
                                    item.id.toString().includes(currentSearch);
                
                const matchCategory = currentCategory === "ALL" || item.category === currentCategory;
                
                const completed = isItemComplete(item);
                let matchStatus = true;
                if (currentStatusFilter === "COMPLETE") matchStatus = completed;
                if (currentStatusFilter === "INCOMPLETE") matchStatus = !completed;

                return matchSearch && matchCategory && matchStatus;
            });

            document.getElementById("stat-showing").textContent = filtered.length;

            if (filtered.length === 0) {
                emptyState.classList.remove("hidden");
                return;
            } else {
                emptyState.classList.add("hidden");
            }

            filtered.forEach((item, index) => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-800/40 transition duration-150 border-b border-slate-800/50";

                tr.innerHTML = `
                    <td class="py-3.5 px-6 text-center font-mono text-slate-500">${item.id}</td>
                    <td class="py-3.5 px-6 font-bold text-slate-100 flex items-center gap-2">
                        ${item.name}
                    </td>
                    <td class="py-3.5 px-6 text-center">
                        <span class="px-2.5 py-1 rounded-md text-xs font-mono bg-slate-800 text-slate-400 border border-slate-700/60">
                            ${item.category}
                        </span>
                    </td>
                    <td class="py-3.5 px-6 text-center">${getStatusBadge(item.astral)}</td>
                    <td class="py-3.5 px-6 text-center font-mono font-semibold ${item.count === 4 ? 'text-cyan-400' : 'text-slate-500'}">${item.count}</td>
                    <td class="py-3.5 px-6 text-center">${getStatusBadge(item.divine)}</td>
                    <td class="py-3.5 px-6 text-center">${getStatusBadge(item.void)}</td>
                `;

                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
