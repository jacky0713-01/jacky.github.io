        // State Management with LocalStorage
        let itemsData = loadItemsData();

        function loadItemsData() {
            const saved = localStorage.getItem("game_collection_data_v2");
            if (saved) {
                try { return JSON.parse(saved); } catch (e) { console.error(e); }
            }
            return JSON.parse(JSON.stringify(DEFAULT_ITEMS));
        }

        function saveItemsData() {
            localStorage.setItem("game_collection_data_v2", JSON.stringify(itemsData));
            calculateGlobalStats();
        }

        // Global Filters State
        let currentSearch = "";
        let currentCategory = "ALL";
        let currentStatusFilter = "ALL";

        // Initialize App
        document.addEventListener("DOMContentLoaded", () => {
            populateCategories();
            calculateGlobalStats();
            renderTable();

            // Setup Event Listeners
            document.getElementById("search-input").addEventListener("input", (e) => {
                currentSearch = e.target.value.trim().toLowerCase();
                renderTable();
            });

            document.getElementById("category-filter").addEventListener("change", (e) => {
                currentCategory = e.target.value;
                renderTable();
            });

            document.querySelectorAll(".status-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    document.querySelectorAll(".status-btn").forEach(b => {
                        b.classList.remove("active", "bg-slate-800", "text-cyan-400");
                        b.classList.add("text-slate-400");
                    });
                    
                    btn.classList.add("active", "bg-slate-800", "text-cyan-400");
                    btn.classList.remove("text-slate-400");
                    
                    currentStatusFilter = btn.dataset.status;
                    renderTable();
                });
            });

            document.getElementById("reset-btn").addEventListener("click", () => {
                if (confirm("確定要將所有收集數據重置為預設狀態嗎？")) {
                    itemsData = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
                    saveItemsData();
                    renderTable();
                }
            });
        });

        function populateCategories() {
            const categories = Array.from(new Set(DEFAULT_ITEMS.map(item => item.category)));
            const select = document.getElementById("category-filter");
            select.innerHTML = `<option value="ALL">全部分類 (All Categories)</option>`;
            categories.forEach(cat => {
                const opt = document.createElement("option");
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        function isItemComplete(item) {
            return item.astral && item.count === 4 && item.divine && item.void;
        }

        function calculateGlobalStats() {
            const total = itemsData.length;
            const completedCount = itemsData.filter(isItemComplete).length;
            const progressPct = Math.round((completedCount / total) * 100);

            document.getElementById("stat-total").textContent = total;
            document.getElementById("stat-completed").textContent = completedCount;
            document.getElementById("stat-incomplete").textContent = total - completedCount;
            
            document.getElementById("global-progress-text").textContent = `${progressPct}%`;
            document.getElementById("global-progress-bar").style.width = `${progressPct}%`;
        }

        function getStatusBadgeHtml(itemId, field, isCollected) {
            if (isCollected) {
                return `<button onclick="toggleField(${itemId}, '${field}')" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-950/80 text-emerald-400 border border-emerald-800/60 glow-green hover:bg-emerald-900 transition">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>已收集
                </button>`;
            } else {
                return `<button onclick="toggleField(${itemId}, '${field}')" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-950/40 text-rose-400 border border-rose-900/40 opacity-75 hover:opacity-100 hover:bg-rose-900/50 transition">
                    未收集
                </button>`;
            }
        }

        function getCountBadgeHtml(itemId, count) {
            const isFull = count === 4;
            return `<div class="inline-flex items-center gap-1.5 bg-slate-950 px-2 py-1 rounded-lg border border-slate-800">
                <button onclick="changeCount(${itemId}, -1)" class="w-5 h-5 flex items-center justify-center rounded bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300">-</button>
                <span class="w-4 text-center font-mono font-bold ${isFull ? 'text-cyan-400' : 'text-slate-400'}">${count}</span>
                <button onclick="changeCount(${itemId}, 1)" class="w-5 h-5 flex items-center justify-center rounded bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300">+</button>
            </div>`;
        }

        window.toggleField = function(id, field) {
            const item = itemsData.find(i => i.id === id);
            if (item) {
                item[field] = !item[field];
                // Auto sync count if astral is toggled
                if (field === 'astral') {
                    item.count = item.astral ? 4 : 0;
                }
                saveItemsData();
                renderTable();
            }
        };

        window.changeCount = function(id, delta) {
            const item = itemsData.find(i => i.id === id);
            if (item) {
                item.count = Math.max(0, Math.min(4, item.count + delta));
                if (item.count > 0) item.astral = true;
                if (item.count === 0) item.astral = false;
                saveItemsData();
                renderTable();
            }
        };

        function renderTable() {
            const tbody = document.getElementById("items-table-body");
            const emptyState = document.getElementById("empty-state");
            tbody.innerHTML = "";

            const filtered = itemsData.filter(item => {
                const matchSearch = item.name.toLowerCase().includes(currentSearch) || 
                                    item.category.toLowerCase().includes(currentSearch) ||
                                    item.id.toString().includes(currentSearch);
                
                const matchCategory = currentCategory === "ALL" || item.category === currentCategory;
                
                const completed = isItemComplete(item);
                let matchStatus = true;
                if (currentStatusFilter === "COMPLETE") matchStatus = completed;
                if (currentStatusFilter === "INCOMPLETE") matchStatus = !completed;

                return matchSearch && matchCategory && matchStatus;
            });

            document.getElementById("stat-showing").textContent = filtered.length;

            if (filtered.length === 0) {
                emptyState.classList.remove("hidden");
                return;
            } else {
                emptyState.classList.add("hidden");
            }

            filtered.forEach((item) => {
                const tr = document.createElement("tr");
                const completed = isItemComplete(item);
                tr.className = `transition duration-150 border-b border-slate-800/50 ${completed ? 'bg-emerald-950/10 hover:bg-slate-800/40' : 'hover:bg-slate-800/40'}`;

                tr.innerHTML = `
                    <td class="py-3.5 px-6 text-center font-mono text-slate-500">${item.id}</td>
                    <td class="py-3.5 px-6 font-bold text-slate-100">
                        ${item.name}
                    </td>
                    <td class="py-3.5 px-6 text-center">
                        <span class="px-2.5 py-1 rounded-md text-xs font-mono bg-slate-800 text-slate-300 border border-slate-700/60">
                            ${item.category}
                        </span>
                    </td>
                    <td class="py-3.5 px-6 text-center">${getStatusBadgeHtml(item.id, 'astral', item.astral)}</td>
                    <td class="py-3.5 px-6 text-center">${getCountBadgeHtml(item.id, item.count)}</td>
                    <td class="py-3.5 px-6 text-center">${getStatusBadgeHtml(item.id, 'divine', item.divine)}</td>
                    <td class="py-3.5 px-6 text-center">${getStatusBadgeHtml(item.id, 'void', item.void)}</td>
                `;

                tbody.appendChild(tr);
            });
        }
    </script>
