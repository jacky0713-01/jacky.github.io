    // 狀態管理
    let currentSearch = "";
    let currentCategory = "ALL";
    let currentStatus = "ALL";

    // 初始化選單
    function initCategoryFilter() {
      const select = document.getElementById("category-filter");
      const categories = [...new Set(rawData.map(item => item.category))];
      categories.forEach(cat => {
        const option = document.createElement("option");
        option.value = cat;
        option.textContent = cat;
        select.appendChild(option);
      });
    }

    // 計算完成狀態
    function isItemCompleted(item) {
      return item.astral && item.divine && item.void;
    }

    // 更新統計指標
    function updateStats() {
      const total = rawData.length;
      const completedCount = rawData.filter(isItemCompleted).length;
      const rate = ((completedCount / total) * 100).toFixed(1);

      document.getElementById("stat-total").textContent = total;
      document.getElementById("stat-completed").textContent = completedCount;
      document.getElementById("stat-rate").textContent = `${rate}%`;
      document.getElementById("stat-incomplete").textContent = total - completedCount;
      document.getElementById("stat-progress-bar").style.width = `${rate}%`;
    }

    // 渲染資料表
    function renderTable() {
      const tbody = document.getElementById("table-body");
      tbody.innerHTML = "";

      const filtered = rawData.filter(item => {
        // 搜尋比對
        const matchSearch = item.name.toLowerCase().includes(currentSearch.toLowerCase()) ||
                            item.id.toString().includes(currentSearch) ||
                            item.category.toLowerCase().includes(currentSearch.toLowerCase());
        
        // 分類比對
        const matchCategory = currentCategory === "ALL" || item.category === currentCategory;

        // 完集狀態比對
        const completed = isItemCompleted(item);
        const matchStatus = currentStatus === "ALL" ||
                            (currentStatus === "COMPLETED" && completed) ||
                            (currentStatus === "INCOMPLETE" && !completed);

        return matchSearch && matchCategory && matchStatus;
      });

      document.getElementById("stat-showing").textContent = filtered.length;

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="py-12 text-center text-gray-500">
              無符合條件的物品資料
            </td>
          </tr>
        `;
        return;
      }

      filtered.forEach((item) => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-gray-800/50 transition-colors duration-150";

        const astralBadge = item.astral
          ? `<span class="px-2.5 py-1 text-xs rounded-md glow-collected font-medium">已收集</span>`
          : `<span class="px-2.5 py-1 text-xs rounded-md glow-uncollected font-medium">未收集</span>`;

        const divineBadge = item.divine
          ? `<span class="px-2.5 py-1 text-xs rounded-md glow-collected font-medium">已收集</span>`
          : `<span class="px-2.5 py-1 text-xs rounded-md glow-uncollected font-medium">未收集</span>`;

        const voidBadge = item.void
          ? `<span class="px-2.5 py-1 text-xs rounded-md glow-collected font-medium">已收集</span>`
          : `<span class="px-2.5 py-1 text-xs rounded-md glow-uncollected font-medium">未收集</span>`;

        tr.innerHTML = `
          <td class="py-3.5 px-6 font-mono text-gray-500 text-xs">${item.id}</td>
          <td class="py-3.5 px-6 font-bold text-gray-100">${item.name}</td>
          <td class="py-3.5 px-6 text-gray-400 text-xs">
            <span class="bg-gray-800 border border-gray-700 px-2 py-0.5 rounded text-gray-300 font-medium">${item.category}</span>
          </td>
          <td class="py-3.5 px-6 text-center">${astralBadge}</td>
          <td class="py-3.5 px-6 text-center font-mono text-gray-300 font-semibold">${item.count}</td>
          <td class="py-3.5 px-6 text-center">${divineBadge}</td>
          <td class="py-3.5 px-6 text-center">${voidBadge}</td>
        `;

        tbody.appendChild(tr);
      });
    }

    // 事件監聽
    document.getElementById("search-input").addEventListener("input", (e) => {
      currentSearch = e.target.value.trim();
      renderTable();
    });

    document.getElementById("category-filter").addEventListener("change", (e) => {
      currentCategory = e.target.value;
      renderTable();
    });

    document.querySelectorAll(".status-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".status-btn").forEach(b => {
          b.className = "status-btn px-3 py-1.5 text-xs font-medium rounded-md text-gray-400 hover:text-white";
        });
        btn.className = "status-btn px-3 py-1.5 text-xs font-medium rounded-md bg-indigo-600 text-white shadow";
        currentStatus = btn.dataset.status;
        renderTable();
      });
    });

    // 初始化執行
    initCategoryFilter();
    updateStats();
    renderTable();
  </script>
