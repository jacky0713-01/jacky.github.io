<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox 物品收集圖鑑 (188項)</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #bb86fc;
      --text-color: #e0e0e0;
      --completed-color: #03dac6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 { margin: 0; font-size: 1.5rem; }

    .auth-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #2c2c2c;
      padding: 8px 16px;
      border-radius: 8px;
    }

    button {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { opacity: 0.9; }

    /* 唯讀模式控制：未登入時禁止編輯卡片與勾選 */
    body.read-only .item-card {
      pointer-events: none;
      opacity: 0.85;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .item-card {
      background-color: var(--card-bg);
      border: 2px solid #333;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .item-card.completed {
      border-color: var(--completed-color);
      background-color: #1a2725;
    }

    .item-category {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 4px;
    }

    .item-name {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .status-badge {
      font-size: 0.8rem;
      color: var(--completed-color);
    }
  </style>
</head>
<body class="read-only">

  <header>
    <h1>Roblox 188 物品進度追蹤器</h1>
    <div class="auth-box">
      <span id="auth-status">當前狀態：瀏覽模式 (唯讀)</span>
      <button id="auth-btn">管理員登入</button>
    </div>
  </header>

  <div class="grid-container" id="item-grid"></div>

  <!-- 引入 Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // 你的 Firebase 金鑰設定 (已自動為你填入專案資訊)
    const firebaseConfig = {
      apiKey: "AIzaSyBh4wNEwXzGOxKOJqj3Akg7gj1WxFHzmNQ",
      authDomain: "throw-a-coin.firebaseapp.com",
      projectId: "throw-a-coin",
      storageBucket: "throw-a-coin.firebasestorage.app",
      messagingSenderId: "79225369395",
      appId: "1:79225369395:web:ac6b6dadb1154159c40446",
      measurementId: "G-B84NLZX6Z8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // 產生 188 項範例物品資料
    const TOTAL_ITEMS = 188;
    let itemsData = {};
    for (let i = 1; i <= TOTAL_ITEMS; i++) {
      itemsData[`item_${i}`] = { id: i, name: `物品 #${i}`, category: `分類 ${Math.ceil(i / 20)}`, completed: false };
    }

    const grid = document.getElementById("item-grid");
    const authBtn = document.getElementById("auth-btn");
    const authStatus = document.getElementById("auth-status");

    // 渲染 UI 列表
    function renderGrid() {
      grid.innerHTML = "";
      Object.keys(itemsData).forEach(key => {
        const item = itemsData[key];
        const card = document.createElement("div");
        card.className = `item-card ${item.completed ? 'completed' : ''}`;
        card.onclick = () => toggleItem(key);
        card.innerHTML = `
          <div class="item-category">${item.category}</div>
          <div class="item-name">${item.name}</div>
          <div class="status-badge">${item.completed ? '✓ 已收集' : '未完成'}</div>
        `;
        grid.appendChild(card);
      });
    }

    // 點擊切換收集狀態 (只有登入後可修改並同步雲端)
    async function toggleItem(key) {
      if (!auth.currentUser) return;
      itemsData[key].completed = !itemsData[key].completed;
      renderGrid();
      
      // 同步到 Firestore 雲端資料庫
      try {
        await setDoc(doc(db, "tracker", "progress"), { items: itemsData }, { merge: true });
      } catch (e) {
        console.error("寫入資料庫失敗：", e);
      }
    }

    // 監聽雲端資料庫更新 (任何裝置更新，網頁即時同步)
    onSnapshot(doc(db, "tracker", "progress"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.items) {
          itemsData = data.items;
          renderGrid();
        }
      }
    });

    // 監聽登入狀態改變
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.body.classList.remove("read-only");
        authStatus.innerText = `管理者已登入 (${user.email})`;
        authBtn.innerText = "登出";
      } else {
        document.body.classList.add("read-only");
        authStatus.innerText = "當前狀態：瀏覽模式 (唯讀)";
        authBtn.innerText = "管理員登入";
      }
    });

    // 登入 / 登出 按鈕事件
    authBtn.onclick = async () => {
      if (auth.currentUser) {
        await signOut(auth);
        alert("已成功登出！");
      } else {
        const email = prompt("請輸入管理者 Email：");
        const password = prompt("請輸入密碼：");
        if (email && password) {
          try {
            await signInWithEmailAndPassword(auth, email, password);
            alert("登入成功！已解鎖編輯權限。");
          } catch (err) {
            alert("登入失敗：帳號或密碼錯誤！");
          }
        }
      }
    };

    renderGrid();
  </script>
</body>
</html>
